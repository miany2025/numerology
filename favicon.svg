<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0a0e27" rx="80"/>

  <!-- Stars -->
  <circle cx="60" cy="45" r="2" fill="white" opacity="0.7"/>
  <circle cx="150" cy="22" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="380" cy="38" r="2" fill="white" opacity="0.8"/>
  <circle cx="470" cy="60" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="100" cy="410" r="2" fill="white" opacity="0.5"/>
  <circle cx="430" cy="430" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="460" cy="310" r="2" fill="#b537f2" opacity="0.6"/>
  <circle cx="55" cy="280" r="2" fill="#00d4ff" opacity="0.5"/>

  <!-- Glow rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.12"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#b537f2" stroke-width="0.8" opacity="0.08"/>

  <!-- Triangle gradient -->
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#b537f2"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b537f2" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Main triangle fill -->
  <polygon points="256,60 460,420 52,420" fill="url(#ig)"/>
  <!-- Main triangle stroke -->
  <polygon points="256,60 460,420 52,420" fill="none" stroke="url(#tg)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner inverted triangle -->
  <polygon points="256,300 330,160 182,160" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linejoin="round" opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="7" fill="#00d4ff" opacity="0.9"/>
  <circle cx="256" cy="256" r="13" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Vertex: top -->
  <circle cx="256" cy="60" r="28" fill="#0a0e27" stroke="#00d4ff" stroke-width="2"/>
  <text x="256" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#00d4ff">7</text>

  <!-- Vertex: bottom-right -->
  <circle cx="460" cy="420" r="28" fill="#0a0e27" stroke="#b537f2" stroke-width="2"/>
  <text x="460" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#b537f2">3</text>

  <!-- Vertex: bottom-left -->
  <circle cx="52" cy="420" r="28" fill="#0a0e27" stroke="#00d4ff" stroke-width="2"/>
  <text x="52" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#00d4ff">9</text>

  <!-- Small accent stars -->
  <polygon points="370,98 373,107 383,107 375,113 378,122 370,116 362,122 365,113 357,107 367,107" fill="#b537f2" opacity="0.7"/>
  <polygon points="148,120 151,128 159,128 153,133 155,141 148,136 141,141 143,133 137,128 145,128" fill="#00d4ff" opacity="0.5"/>
</svg>
